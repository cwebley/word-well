name: API integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wordwell_test
          POSTGRES_USER: wordwell
          POSTGRES_PASSWORD: wordwell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordwell -d wordwell_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://wordwell:wordwell@localhost:5432/wordwell_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:api
