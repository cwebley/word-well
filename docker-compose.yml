services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordwell_test
      POSTGRES_USER: wordwell
      POSTGRES_PASSWORD: wordwell
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # Named so private evaluation history survives container recreation.
      - wordwell-postgres:/var/lib/postgresql/data
      # Runs only when the volume is first initialized.
      - ./db/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordwell -d wordwell_test"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  wordwell-postgres:
    name: wordwell-postgres
