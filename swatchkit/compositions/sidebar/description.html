<div class="flow">
  <p>
    The Sidebar composition places a flexible content area beside a fixed-width
    companion area, then wraps them when the content reaches its minimum width.
  </p>
  <p>
    Set <code>data-direction="rtl"</code> to put the sidebar on the right. Set
    <code>data-reversed</code> to reverse the visual order without changing
    source order.
  </p>
</div>
